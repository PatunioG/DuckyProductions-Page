# Workflow para compilar y publicar automáticamente Ducky Productions en GitHub Pages
name: Deploy Ducky Productions to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Permisos requeridos para publicar en GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Permite una sola implementación simultánea, omitiendo ejecuciones intermedias en cola
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    name: Compilar Proyecto
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar dependencias
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Compilar aplicación Vite para producción
        env:
          VITE_BASE_PATH: /DuckyProductions-Page/
        run: npm run build

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Subir artefacto de producción (dist)
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    name: Publicar en GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Desplegar a GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
